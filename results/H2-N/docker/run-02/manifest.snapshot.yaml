id: H2-N
title: "Null intervention: a configuration change touching none of the three conditions"
paper: "Paper 1A, Section 5.2 (affirmative warrant) and Section 6.6 (specificity control)"
parent: "H4 Ablation Harness I-1 receiver, https://doi.org/10.5281/zenodo.22711457"
harness_version: 0.2.0

operation:
  description: "Source S causes receiver R to change test_value from 0 to 42."
  q0: "test_value=0"
  q1: "test_value=42"

intervention:
  description: "The receiver's log verbosity setting is changed. No admission relation, route or access-control state is touched."
  changed_condition: "None."
  what_it_tests: >
    Specificity. The harness and the evidence rules must register no
    structural change where none has occurred: every condition recorded
    present on its own evidence and the operation occurring. Together with
    the sham control (prediction of absence with no intervention, expected
    FAIL) this bounds the classifier from both sides.

baseline_prediction: [1, 1, 1, 1]
post_ablation_prediction: [1, 1, 1, 1]
restored_prediction: [1, 1, 1, 1]

measurement:
  I: {post: "interface_admit for S"}
  X: {post: "handler_reached for S; marker observed"}
  A: {post: "ACCESS_STATE grants; AUTHORITY_PROBE writes"}
  O: {post: "0 -> 42; state_write for S; policy shows the verbosity change applied"}

classification_rule:
  pass: "baseline, post and restored all [1,1,1,1] with affirmative evidence and the intervention evidenced"
  fail: "any affirmatively evidenced value differs from 1"
  ambiguous: "required evidence cannot be established"
